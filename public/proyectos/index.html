<script>
    
    function hideHashtagLines() {
        
        const contentAreas = document.querySelectorAll('.entry-content, .post-content');
        contentAreas.forEach(entry => {
            const paragraphs = entry.querySelectorAll('p');
            paragraphs.forEach(p => {
                const text = p.textContent.trim();
                
                if (/^(#[\w]+\s*)+$/.test(text)) {
                    
                    p.style.display = 'none';
                }
            });
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        
        hideHashtagLines();
        
        setTimeout(hideHashtagLines, 100);

        const buttons = document.querySelectorAll('.filter-btn[data-filter]');
        const posts = document.querySelectorAll('article[data-filters]');

        console.log("Filtros listos. Posts en página:", posts.length);

        function updateView() {
            const activeButtons = Array.from(buttons).filter(b => b.classList.contains('active'));
            let visibleCount = 0;

            posts.forEach(post => {
                const rawPostData = post.getAttribute('data-filters') || "";
                const postFilters = rawPostData.toLowerCase().split(/[\s,]+/).filter(f => f.trim() !== "");

                
                
                const matchesAll = activeButtons.every(btn => {
                    const btnValues = btn.getAttribute('data-filter').toLowerCase().split(' ');
                    return btnValues.some(val => postFilters.includes(val));
                });

                if (activeButtons.length === 0 || matchesAll) {
                    post.style.setProperty('display', 'block', 'important');
                    post.style.opacity = '1';
                    visibleCount++;
                } else {
                    post.style.setProperty('display', 'none', 'important');
                }
            });

            console.log("Filtros activos:", activeButtons.map(b => b.textContent.trim()), "| Mostrando:", visibleCount);

            
            let noResults = document.getElementById('no-results-msg');
            if (visibleCount === 0 && activeButtons.length > 0) {
                if (!noResults) {
                    noResults = document.createElement('div');
                    noResults.id = 'no-results-msg';
                    noResults.innerHTML = '<p style="text-align:center; padding: 40px; color: #555; font-family: monospace;">[!] NO SE ENCONTRARON RESULTADOS PARA ESTA COMBINACIÓN</p>';
                    document.querySelector('.main').appendChild(noResults);
                }
            } else if (noResults) {
                noResults.remove();
            }
        }

        buttons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                btn.classList.toggle('active');
                updateView();
            });
        });

        
        const clearBtn = document.getElementById('clear-filters');
        if (clearBtn) {
            clearBtn.addEventListener('click', (e) => {
                e.preventDefault();
                buttons.forEach(btn => btn.classList.remove('active'));
                updateView();
            });
        }

        
        updateView();
    });

<script>
    const canvas = document.getElementById('constellation-bg');
    const ctx = canvas.getContext('2d');

    let particles = [];
    const particleCount = 150; 
    const connectionDistance = 120;
    const mouse = { x: null, y: null, radius: 180 };

    window.addEventListener('mousemove', (event) => {
        mouse.x = event.x;
        mouse.y = event.y;
    });

    window.addEventListener('mouseout', () => {
        mouse.x = null;
        mouse.y = null;
    });

    function init() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        particles = [];
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }
    }

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 0.5;
            this.vy = (Math.random() - 0.5) * 0.5;
            this.size = Math.random() * 1.5 + 0.5;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;

            if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
            if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
        }

        draw() {
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();

            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < connectionDistance) {
                    const opacity = 1 - (distance / connectionDistance);
                    
                    ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.2})`;
                    ctx.lineWidth = 0.8;
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.stroke();
                }
            }

            if (mouse.x !== null) {
                const dx = particles[i].x - mouse.x;
                const dy = particles[i].y - mouse.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < mouse.radius) {
                    const opacity = 1 - (distance / mouse.radius);
                    
                    ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.4})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(mouse.x, mouse.y);
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', init);
    init();
    animate();
</script>

            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
<script>
    var mybutton = document.getElementById("top-link");
    window.onscroll = function () {
        if (document.body.scrollTop > 800 || document.documentElement.scrollTop > 800) {
            mybutton.style.visibility = "visible";
            mybutton.style.opacity = "1";
        } else {
            mybutton.style.visibility = "hidden";
            mybutton.style.opacity = "0";
        }
    };

</script></body>

</html>
