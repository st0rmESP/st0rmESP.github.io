<!-- Sistema de Filtrado Dinámico JS -->
<script>
    // Ocultar líneas de solo hashtags en todo el contenido
    function hideHashtagLines() {
        // Aplicar a entry-content (listas) y post-content (artículos individuales)
        const contentAreas = document.querySelectorAll('.entry-content, .post-content');
        contentAreas.forEach(entry => {
            const paragraphs = entry.querySelectorAll('p');
            paragraphs.forEach(p => {
                const text = p.textContent.trim();
                // Detectar si el párrafo contiene SOLO hashtags (con espacios entre ellos)
                if (/^(#[\w]+\s*)+$/.test(text)) {
                    // Ocultar el párrafo completamente
                    p.style.display = 'none';
                }
            });
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        // Ejecutar inmediatamente
        hideHashtagLines();
        // Ejecutar después de un pequeño delay para asegurar
        setTimeout(hideHashtagLines, 100);

        const buttons = document.querySelectorAll('.filter-btn[data-filter]');
        const posts = document.querySelectorAll('article[data-filters]');

        console.log("Filtros listos. Posts en página:", posts.length);

        function updateView() {
            const activeButtons = Array.from(buttons).filter(b => b.classList.contains('active'));
            let visibleCount = 0;

            posts.forEach(post => {
                const rawPostData = post.getAttribute('data-filters') || "";
                const postFilters = rawPostData.toLowerCase().split(/[\s,]+/).filter(f => f.trim() !== "");

                // Lógica: El post debe coincidir con TODOS los botones activos.
                // Un botón coincide si el post tiene CUALQUIERA de las palabras del data-filter de ese botón.
                const matchesAll = activeButtons.every(btn => {
                    const btnValues = btn.getAttribute('data-filter').toLowerCase().split(' ');
                    return btnValues.some(val => postFilters.includes(val));
                });

                if (activeButtons.length === 0 || matchesAll) {
                    post.style.setProperty('display', 'block', 'important');
                    post.style.opacity = '1';
                    visibleCount++;
                } else {
                    post.style.setProperty('display', 'none', 'important');
                }
            });

            console.log("Filtros activos:", activeButtons.map(b => b.textContent.trim()), "| Mostrando:", visibleCount);

            // Mensaje si no hay resultados
            let noResults = document.getElementById('no-results-msg');
            if (visibleCount === 0 && activeButtons.length > 0) {
                if (!noResults) {
                    noResults = document.createElement('div');
                    noResults.id = 'no-results-msg';
                    noResults.innerHTML = '<p style="text-align:center; padding: 40px; color: #555; font-family: monospace;">[!] NO SE ENCONTRARON RESULTADOS PARA ESTA COMBINACIÓN</p>';
                    document.querySelector('.main').appendChild(noResults);
                }
            } else if (noResults) {
                noResults.remove();
            }
        }

        buttons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                btn.classList.toggle('active');
                updateView();
            });
        });

        // Botón Clear All
        const clearBtn = document.getElementById('clear-filters');
        if (clearBtn) {
            clearBtn.addEventListener('click', (e) => {
                e.preventDefault();
                buttons.forEach(btn => btn.classList.remove('active'));
                updateView();
            });
        }

        // Forzar vista inicial
        updateView();
    });
</script>
