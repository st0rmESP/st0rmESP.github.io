baseURL = 'https://st0rmESP.github.io/'
languageCode = 'es'
title = 'st0rmESP'
theme = 'PaperMod'

[outputs]
    home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "monokai"
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 1
  [markup.goldmark.renderer]
    unsafe = true

[params]
    author = "st0rm"
    env = "production"
    title = "st0rmESP"
    description = "Writeups de Ciberseguridad | CTF Player | Cryptography"
    
    # --- FIX MODO OSCURO ---
    defaultTheme = "dark"
    disableThemeToggle = true
    ShowShareButtons = true
    ShowReadingTime = false
    ShowBreadCrumbs = true
    ShowCodeCopyButtons = true
    
    copyright = "© 2026 st0rmESP"
    
    # Iconos y Favicon
    [params.assets]
        favicon = "favicon.png"

    # --- PERFIL DE LA PÁGINA PRINCIPAL ---
    [params.profileMode]
        enabled = true
        title = "st0rm 🚩"
        subtitle = "Bienvenido a mi rincón de ciberseguridad. Aquí comparto mis writeups de **HackTheBox**, retos de **criptografía**, **reversing** y mis proyectos."
        imageUrl = "https://github.com/st0rmESP.png"
        imageWidth = 120
        imageHeight = 120
        
        [[params.profileMode.buttons]]
            name = "Writeups"
            url = "/writeups"
        [[params.profileMode.buttons]]
            name = "Proyectos"
            url = "/proyectos"
        [[params.profileMode.buttons]]
            name = "Sobre mí"
            url = "/about"

    # --- REDES SOCIALES ---
    [[params.socialIcons]]
        name = "github"
        url = "https://github.com/st0rmESP"
    [[params.socialIcons]]
        name = "linkedin"
        url = "https://linkedin.com/in/álvaro-lópez-hack"

[menu]
    [[menu.main]]
        identifier = "search"
        name = "Buscar 🔍"
        url = "/search/"
        weight = 5

    [[menu.main]]
        identifier = "writeups"
        name = "Writeups 🚩"
        url = "/writeups/"
        weight = 10

    [[menu.main]]
        identifier = "proyectos"
        name = "Proyectos 🛠️"
        url = "/proyectos/"
        weight = 20

    [[menu.main]]
        identifier = "tags"
        name = "Tags🏷️"
        url = "/tags/"
        weight = 30